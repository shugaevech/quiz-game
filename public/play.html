<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Квиз</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,sans-serif;background:#2d1b69;color:#fff;text-align:center}
.s{display:none;min-height:100%;padding:20px;flex-direction:column;justify-content:center}.s.on{display:flex}
input{padding:16px;border-radius:12px;border:0;font-size:22px;margin:8px 0;text-align:center;width:100%}
button.m{background:#fff;color:#2d1b69;border:0;border-radius:12px;padding:16px;font-size:22px;font-weight:700;margin-top:8px}
#a{display:grid;grid-template-columns:1fr 1fr;gap:12px;height:100vh;padding:12px}
#a button{border:0;border-radius:14px;color:#fff;font-size:64px}
#a button:nth-child(1){background:#e21b3c}#a button:nth-child(2){background:#1368ce}#a button:nth-child(3){background:#d89e00}#a button:nth-child(4){background:#26890c}
#s2{padding:0}.big{font-size:70px}#e{color:#ffb3b3;min-height:24px}
</style></head><body>
<div class="s on" id="s0"><h1>🎯 Квиз</h1><input id="c" placeholder="Код игры" inputmode="numeric"><input id="n" placeholder="Ваше имя" maxlength="20">
<button class="m" onclick="join()">Войти</button><div id="e"></div></div>
<div class="s" id="s1"><div class="big">✅</div><h2 id="hi"></h2><p>Вы в игре! Смотрите на главный экран…</p></div>
<div class="s" id="s2"><div id="a"></div></div>
<div class="s" id="s3"><div class="big">⏳</div><h2>Ответ принят</h2><p>Ждём остальных…</p></div>
<div class="s" id="s4"><div class="big" id="ri"></div><h2 id="rt"></h2><p id="rs"></p></div>
<div class="s" id="s5"><div class="big">🏁</div><h2>Игра окончена</h2><p id="fs"></p></div>
<script>
const $=s=>document.getElementById(s),show=n=>document.querySelectorAll('.s').forEach((e,i)=>e.classList.toggle('on',i===n));
let id=localStorage.qid||(localStorage.qid=Math.random().toString(36).slice(2)+Date.now().toString(36));
$('c').value=new URLSearchParams(location.search).get('c')||'';$('n').value=localStorage.qname||'';
let ws,tries=0;
function connect(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>{if(joined)sendJoin()};
  ws.onclose=()=>{if(joined&&tries++<20)setTimeout(connect,1500)};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
   if(m.t==='err'){$('e').textContent=m.msg;joined=false;show(0)}
   else if(m.t==='joined'){$('hi').textContent=m.name;show(1)}
   else if(m.t==='q'){$('a').innerHTML=Array.from({length:m.n},(_,i)=>'<button onclick="ans('+i+')">'+'▲◆●■'[i]+'</button>').join('');show(2)}
   else if(m.t==='ok')show(3)
   else if(m.t==='r'){$('ri').textContent=m.ok?'🎉':'😕';$('rt').textContent=m.ok?'Верно! +'+m.gain:'Неверно';$('rs').textContent='Очки: '+m.score+' · Место: '+m.rank;show(4)}
   else if(m.t==='end'){$('fs').textContent='Ваше место: '+m.rank+' · Очки: '+m.score;show(5)}
  };
}
let joined=false;
const sendJoin=()=>ws.send(JSON.stringify({t:'join',code:$('c').value.trim(),name:$('n').value,id}));
function join(){localStorage.qname=$('n').value;joined=true;$('e').textContent='';if(ws.readyState===1)sendJoin()}
const ans=c=>ws.send(JSON.stringify({t:'ans',c}));
connect();
</script></body></html>
